<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Canon</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#18181b;display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #f0f0f2}
header b{font-size:17px}header small{margin-left:auto;font-size:13px;color:#71717a}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px}
h1{font-size:26px;font-weight:600;text-align:center;margin-bottom:24px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:1px solid #e4e4e7;border-radius:14px;padding:12px;font-size:14px;color:#3f3f46}
.composer{padding:12px 14px 22px}
.box{display:flex;align-items:center;gap:10px;background:#f4f4f5;border-radius:26px;padding:8px 8px 8px 18px}
.box span{flex:1;color:#71717a}.go{width:38px;height:38px;border-radius:50%;background:#18181b;color:#fff;display:grid;place-items:center}
.note{font-size:11.5px;color:#71717a;text-align:center;margin-top:8px}
</style></head><body>
<header><b>Avicenna</b><small>CS ▾</small></header>
<main><h1>Jak vám mohu pomoci?</h1>
<div class="chips"><div class="chip">Studie pro děti s leukemií v Motole</div><div class="chip">Co znamená „nábor otevřen“?</div><div class="chip">Přiložit zprávu</div><div class="chip">Rozhovor s lékařem</div></div></main>
<div class="composer"><div class="box"><span>Napište zprávu…</span><div class="go">↑</div></div><p class="note">Avicenna může chybovat. Nenahrazuje lékaře.</p></div>
</body></html>
