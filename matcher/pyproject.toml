[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avicenna-matcher"
version = "0.1.0"
description = "Deterministic, offline hospital-side trial matcher (avicenna.matcher/0.1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.17",
]

[project.scripts]
avicenna-matcher = "avicenna_matcher.cli:main"
avicenna-mcp = "avicenna_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
mcp = [
    "mcp>=1.10",
]

[tool.setuptools]
packages = ["avicenna_matcher", "avicenna_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"

[tool.coverage.run]
source = ["avicenna_matcher", "avicenna_mcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
